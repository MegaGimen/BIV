<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一轮训练：用什么去贴什么</title>
<style>
  :root {
    --bg: #f3efe6;
    --ink: #1c1914;
    --muted: #6f685e;
    --line: #ddd4c6;
    --card: #faf7f1;
    --hist: #1d6a58;
    --hist-bg: #e5f2ee;
    --act: #1d4f8f;
    --act-bg: #e7eef8;
    --obs: #8d4b28;
    --obs-bg: #f8ece4;
    --fit: #c84b24;
    --fit-bg: #fde8df;
    --back: #8d6a12;
    --back-bg: #f8f0d4;
    --dim: #b9b1a4;
    --shadow: 0 12px 32px rgba(48, 36, 16, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 10% -10%, #fff, transparent 50%),
      var(--bg);
    color: var(--ink);
    font-family: "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 22px 40px; }
  header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; }
  .kicker {
    font-size: 12px; letter-spacing: 0.14em; color: var(--muted); margin: 0 0 6px;
  }
  h1 {
    font-family: "Noto Serif CJK SC", "Noto Serif SC", serif;
    font-weight: 650; font-size: 32px; margin: 0; letter-spacing: -0.02em;
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; font-size: 12px; color: var(--muted); }
  .legend b { font-weight: 650; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .tape {
    margin-top: 22px; display: flex; gap: 8px; align-items: stretch;
  }
  .tok {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 8px 8px; text-align: center; box-shadow: var(--shadow);
    transition: transform .35s ease, opacity .35s ease, border-color .35s ease, background .35s ease;
  }
  .tok .sym { font-family: "Noto Serif CJK SC", serif; font-size: 26px; line-height: 1; }
  .tok .sub { margin-top: 4px; font-size: 11px; color: var(--muted); }
  .tok.hist .sym { color: var(--hist); }
  .tok.act .sym { color: var(--act); }
  .tok.obs .sym { color: var(--obs); }
  .tok.dim { opacity: 0.28; transform: translateY(0); box-shadow: none; }
  .tok.input { border-color: var(--act); background: var(--act-bg); transform: translateY(-3px); }
  .tok.input.hist { border-color: var(--hist); background: var(--hist-bg); }
  .tok.target { border-color: var(--fit); background: var(--fit-bg); transform: translateY(-3px); }
  .tok.hot { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .minimap { margin-top: 14px; display: grid; gap: 6px; }
  .cut {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px;
    border: 1px solid transparent; color: #4a453c; font-size: 13px;
  }
  .cut.on { background: #fff; border-color: var(--line); color: var(--ink); }
  .cut .name { width: 52px; font-weight: 700; }
  .seg {
    border-radius: 8px; padding: 3px 8px; background: #efeae2; font-variant-numeric: tabular-nums;
  }
  .cut.on .seg.hist { background: var(--hist-bg); color: var(--hist); }
  .cut.on .seg.pair { background: var(--fit-bg); color: var(--fit); }
  .cut .seg.hot { outline: 2px solid var(--fit); }
  .stage {
    margin-top: 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); min-height: 390px;
    padding: 18px 20px 16px; display: flex; flex-direction: column;
  }
  .fitbanner { display: flex; flex-wrap: wrap; gap: 8px; min-height: 42px; }
  .fit {
    display: inline-flex; align-items: center; gap: 8px; background: var(--fit-bg);
    color: var(--fit); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 15px;
  }
  .fit.gold { background: var(--back-bg); color: var(--back); }
  .fit .who, .fit .what {
    background: #fff; color: var(--ink); border-radius: 999px; padding: 2px 8px; font-weight: 700;
  }
  .diagram { flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px 0 10px; }
  .caption { margin: 0; font-size: 16px; line-height: 1.55; color: #3a342c; min-height: 52px; }
  .row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    min-width: 92px; text-align: center;
  }
  .card .t { font-size: 12px; color: var(--muted); }
  .card .b { font-family: "Noto Serif CJK SC", serif; font-size: 22px; margin-top: 2px; }
  .card.hist { border-color: #b7ddd3; }
  .card.act { border-color: #c5d5ee; }
  .card.obs { border-color: #f0d2c2; }
  .card.fitc { border-color: #f3c2b2; background: #fff8f5; }
  .card.gold { border-color: #ead48a; background: #fffdf6; }
  .arrow { width: 64px; height: 2px; background: var(--ink); position: relative; flex: 0 0 auto; }
  .arrow::after {
    content: ""; position: absolute; right: -1px; top: -4px;
    border: 5px solid transparent; border-left-color: var(--ink); border-right: 0;
  }
  .arrow span, .varrow span {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: -20px; font-size: 12px; color: var(--fit); white-space: nowrap; font-weight: 700;
  }
  .arrow.plain span { color: var(--muted); font-weight: 500; }
  .varrow {
    width: 2px; height: 28px; background: var(--ink); position: relative;
  }
  .varrow::after {
    content: ""; position: absolute; bottom: -1px; left: -4px;
    border: 5px solid transparent; border-top-color: var(--ink); border-bottom: 0;
  }
  .varrow.gold, .arrow.gold { background: var(--back); }
  .varrow.gold::after { border-top-color: var(--back); }
  .arrow.gold::after { border-left-color: var(--back); }
  .arrow.gold span, .varrow.gold span { color: var(--back); }
  .arrow.back { transform: scaleX(-1); }
  .arrow.back span { transform: translateX(-50%) scaleX(-1); }
  .align-narrow { display: none; }
  .mx { display: grid; grid-template-columns: repeat(4, 11px); gap: 3px; margin: 6px auto 0; }
  .mx i { display: block; height: 11px; border-radius: 2px; background: currentColor; opacity: 0.35; }
  .mats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .mat {
    width: 148px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    text-align: center;
  }
  .mat b { display: block; font-size: 15px; }
  .mat em { display: block; margin-top: 4px; font-style: normal; color: var(--muted); font-size: 12px; }
  .chain { display: flex; flex-direction: column; gap: 8px; width: min(860px, 100%); }
  .step {
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .step .mid { font-size: 13px; color: var(--muted); text-align: center; min-width: 88px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
  .pull {
    width: min(760px, 100%); display: grid; grid-template-columns: 1fr 90px 160px 90px 1fr;
    align-items: center; gap: 6px;
  }
  .pull .center { transform: scale(1.06); }
  .bars { width: min(720px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .bar { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 8px; align-items: center; font-size: 13px; }
  .bar .track { height: 14px; border-radius: 99px; background: #efeae2; overflow: hidden; }
  .bar .track > i { display: block; height: 100%; background: var(--hist); border-radius: 99px; }
  .bar .track.fit > i { background: var(--fit); }
  .sum { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .chip {
    background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 14px;
  }
  .plus { color: var(--muted); font-weight: 700; }
  .gen {
    width: min(860px, 100%); background: #f4f7fb; border-radius: 16px; padding: 16px;
  }
  .tag {
    display: inline-block; font-size: 11px; letter-spacing: 0.08em; color: var(--act);
    border: 1px solid #c5d5ee; border-radius: 99px; padding: 2px 8px; margin-bottom: 8px;
  }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  button {
    font: inherit; background: var(--ink); color: #fff; border: 0; border-radius: 999px;
    padding: 8px 16px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:hover { transform: translateY(-1px); }
  .dots { display: flex; gap: 6px; margin-left: 8px; flex-wrap: wrap; }
  .dots button {
    width: 9px; height: 9px; padding: 0; border-radius: 99px; background: #d5cec2; color: transparent;
  }
  .dots button.on { background: var(--fit); }
  .count { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  @media (max-width: 800px) {
    h1 { font-size: 24px; }
    header { flex-direction: column; align-items: flex-start; }
    .legend { justify-content: flex-start; }
    .tape { overflow-x: auto; padding-bottom: 4px; }
    .tok { min-width: 72px; flex: 0 0 72px; }
    .tok .sym { font-size: 20px; }
    .cut { flex-wrap: wrap; }
    .diagram { overflow-x: auto; justify-content: flex-start; }
    .row { flex-wrap: nowrap; }
    .align-wide { display: none; }
    .align-narrow { display: flex; }
    .controls { flex-wrap: wrap; }
    .dots { order: 5; width: 100%; margin: 8px 0 0; }
    .count { margin-left: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tok, .tok.hot { animation: none; transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="kicker">从随机矩阵出发的一轮</p>
      <h1>用什么去贴什么</h1>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:var(--hist)"></i><b>历史</b> 送进信念</span>
      <span><i class="sw" style="background:var(--act)"></i><b>动作</b> 编成矩阵</span>
      <span><i class="sw" style="background:var(--obs)"></i><b>观察</b> 只当目标</span>
      <span><i class="sw" style="background:var(--fit)"></i><b>拟合</b></span>
      <span><i class="sw" style="background:var(--back)"></i><b>误差回传</b></span>
    </div>
  </header>
  <div class="tape" id="tape"></div>
  <div class="minimap" id="minimap"></div>
  <section class="stage">
    <div class="fitbanner" id="fitbanner"></div>
    <div class="diagram" id="diagram"></div>
    <p class="caption" id="caption"></p>
  </section>
  <div class="controls">
    <button class="ghost" id="prev" type="button">上一步</button>
    <button id="play" type="button">播放</button>
    <button class="ghost" id="next" type="button">下一步</button>
    <div class="dots" id="dots"></div>
    <div class="count" id="count"></div>
  </div>
  <p class="hint">空格播放或暂停，左右方向键换一步。对齐在第 10 步。</p>
</div>
<script>
const TOKENS = [
  { id: "h", sym: "h", sub: "开头", kind: "hist" },
  { id: "a", sym: "a", sub: "动作", kind: "act" },
  { id: "o", sym: "o", sub: "观察", kind: "obs" },
  { id: "a1", sym: "a₁", sub: "动作", kind: "act" },
  { id: "o1", sym: "o₁", sub: "观察", kind: "obs" },
  { id: "a2", sym: "a₂", sub: "动作", kind: "act" },
  { id: "o2", sym: "o₂", sub: "观察", kind: "obs" },
];

const CUTS = [
  { name: "第一刀", hist: "h", pairs: [["a", "o"], ["a₁", "o₁"], ["a₂", "o₂"]] },
  { name: "第二刀", hist: "h a o", pairs: [["a₁", "o₁"], ["a₂", "o₂"]] },
  { name: "第三刀", hist: "h a o a₁ o₁", pairs: [["a₂", "o₂"]] },
];

function mx(color) {
  return `<div class="mx" style="color:${color}">${"<i></i>".repeat(16)}</div>`;
}

function card(cls, title, body, extra = "") {
  return `<div class="card ${cls}"><div class="t">${title}</div><div class="b">${body}</div>${extra}</div>`;
}

function arrow(label, cls = "") {
  return `<div class="arrow ${cls}"><span>${label}</span></div>`;
}

const scenes = [
  {
    title: "一条样本",
    caption: "这一轮只看这一条文本：开头是 h，后面跟着三对动作和观察。权重还是随机的，后面每一步都是在改它们。",
    roles: { h: "input", a: "input", o: "input", a1: "input", o1: "input", a2: "input", o2: "input" },
    cut: -1,
    fit: [],
    html: () => `
      <div class="col">
        <div class="row">
          ${card("hist", "开头", "h")}
          ${arrow("接着", "plain")}
          ${card("act", "动作", "a")}
          ${card("obs", "观察", "o")}
          ${card("act", "动作", "a₁")}
          ${card("obs", "观察", "o₁")}
          ${card("act", "动作", "a₂")}
          ${card("obs", "观察", "o₂")}
        </div>
        <p class="note">符号只代表这段文本在序列里的位置。这里不给它们编故事。</p>
      </div>`
  },
  {
    title: "五张随机表",
    caption: "词向量、信念、去噪、转移、打分，这五张表的数一开始是随机的。这一轮结束时，它们会被同一条样本一起改一次。",
    roles: {},
    cut: -1,
    fit: [],
    html: () => `
      <div class="mats" id="mats">
        ${[
          ["词向量", "把文本变成向量", "var(--ink)"],
          ["信念", "h → μ, logσ²", "var(--hist)"],
          ["去噪", "掺噪的矩阵 → U", "var(--act)"],
          ["转移", "信念 + 动作 → 下一步", "var(--obs)"],
          ["打分", "信念 → v", "var(--back)"],
        ].map(([n, d, c]) => `<div class="mat"><b>${n}</b>${mx(c)}<em>${d}</em></div>`).join("")}
      </div>`,
    enter() {
      const cells = document.querySelectorAll("#mats .mx i");
      cells.forEach((el) => { el.style.opacity = 0.2 + Math.random() * 0.8; });
      this._timer = setInterval(() => {
        cells.forEach((el) => { el.style.opacity = 0.15 + Math.random() * 0.85; });
      }, 220);
    },
    leave() { clearInterval(this._timer); }
  },
  {
    title: "同一条切三刀",
    caption: "第一刀只看见 h，要贴完后面三对。第二刀看见 h、a、o，只贴后面两对。第三刀看见更长的历史，只贴最后一对。",
    roles: {},
    cut: -1,
    hotAll: true,
    fit: [],
    html: () => `
      <div class="bars">
        ${[
          ["第一刀", 18, 82],
          ["第二刀", 46, 54],
          ["第三刀", 74, 26],
        ].map(([name, h, f]) => `
          <div class="bar">
            <b>${name}</b>
            <div class="track" title="看见的历史"><i style="width:${h}%"></i></div>
            <div class="track fit" title="要去贴的后缀"><i style="width:${f}%"></i></div>
          </div>`).join("")}
        <p class="note">左条是送进去的历史，右条是拿来当目标的后缀。三刀的损失最后加在一起。</p>
      </div>`
  },
  {
    title: "第一刀：只读 h",
    caption: "编码器只吃 h，吐出信念的均值 μ 和方差 logσ²。a、o 以及更后面的文本不进这个编码器。信念另外被一个很小的 KL 轻轻拉向标准正态。",
    roles: { h: "input hot", a: "dim", o: "dim", a1: "dim", o1: "dim", a2: "dim", o2: "dim" },
    cut: 0,
    fit: [{ who: "信念", verb: "轻轻贴近", what: "标准正态", gold: true }],
    html: () => `
      <div class="row">
        ${card("hist", "这一刀的输入", "h")}
        ${arrow("编成", "plain")}
        ${card("hist", "信念", "μ, logσ²")}
      </div>`
  },
  {
    title: "动作先贴自己的词",
    caption: "a 变成矩阵 U*。读出表把 U* 读回每个位置的词，答案就是 a 自己的词编号。这一项还没碰后面的观察。",
    roles: { h: "input", a: "target hot", o: "dim", a1: "dim", o1: "dim", a2: "dim", o2: "dim" },
    cut: 0,
    fit: [{ who: "读出表", verb: "去贴", what: "a 的词" }],
    html: () => `
      <div class="row">
        ${card("act", "动作文本", "a", mx("var(--act)"))}
        ${arrow("编成", "plain")}
        ${card("act", "U*", "动作矩阵", mx("var(--act)"))}
        ${arrow("去贴")}
        ${card("fitc", "答案", "a 的词编号")}
      </div>`
  },
  {
    title: "去噪器去贴 U*",
    caption: "把噪声按等级掺进 U*。去噪器读掺过的矩阵、信念和噪声等级，要把结果拉回 U*。噪声从大到小每一级都贴一次，留下最后一级，后面叫它 U。",
    roles: { h: "input", a: "target hot", o: "dim", a1: "dim", o1: "dim", a2: "dim", o2: "dim" },
    cut: 0,
    fit: [{ who: "去噪器", verb: "去贴", what: "U*" }],
    html: () => `
      <div class="col">
        <div class="row">
          ${card("hist", "条件", "μ, logσ²")}
          ${card("act", "掺了噪声", "U* + ε", mx("var(--muted)"))}
          ${arrow("去贴")}
          ${card("act", "留下的 U", "最后一级", mx("var(--act)"))}
        </div>
        <p class="note">U 是去噪器的输出，也是下一步转移要吃的那张动作矩阵。</p>
      </div>`
  },
  {
    title: "用 U 去贴 e(o)",
    caption: "从信念里抽一个样本，把 U 的各行收成一个向量，转移表吐出观察分布的均值和方差。这个分布去贴 e(o)：o 里各个词向量的平均。",
    roles: { h: "input", a: "input", o: "target hot", a1: "dim", o1: "dim", a2: "dim", o2: "dim" },
    cut: 0,
    pair: 0,
    fit: [{ who: "转移", verb: "去贴", what: "e(o)" }],
    html: () => `
      <div class="row">
        ${card("hist", "信念", "μ, logσ²")}
        ${card("act", "还原出的动作", "U", mx("var(--act)"))}
        ${arrow("去贴")}
        ${card("fitc", "观察的词向量", "e(o)")}
      </div>`
  },
  {
    title: "接上 a₁，去贴 e(o₁)",
    caption: "信念加上转移给出的增量，变成下一步的信念。动作换成数据集里的 a₁，直接编成矩阵，这一步不再去噪。转移再吐一个分布，去贴 e(o₁)。",
    roles: { h: "dim", a: "dim", o: "dim", a1: "input", o1: "target hot", a2: "dim", o2: "dim" },
    cut: 0,
    pair: 1,
    fit: [{ who: "转移", verb: "去贴", what: "e(o₁)" }],
    html: () => `
      <div class="row">
        ${card("hist", "更新后的信念", "μ + Δ")}
        ${card("act", "来自数据集", "a₁", mx("var(--act)"))}
        ${arrow("去贴")}
        ${card("fitc", "后一个观察", "e(o₁)")}
      </div>`
  },
  {
    title: "再接 a₂，去贴 e(o₂)",
    caption: "信念再加一次增量，接上数据集里的 a₂，去贴 e(o₂)。到这里，第一刀用同一张 U 带出了后面三个观察向量。",
    roles: { h: "dim", a: "dim", o: "dim", a1: "dim", o1: "dim", a2: "input", o2: "target hot" },
    cut: 0,
    pair: 2,
    fit: [{ who: "转移", verb: "去贴", what: "e(o₂)" }],
    html: () => `
      <div class="col" style="width:min(860px,100%)">
        <div class="chain">
          <div class="step">
            ${card("act", "第一张", "U")}
            ${arrow("去贴")}
            ${card("fitc", "近处", "e(o)")}
          </div>
          <div class="step">
            ${card("act", "数据集", "a₁")}
            ${arrow("去贴")}
            ${card("fitc", "再往后", "e(o₁)")}
          </div>
          <div class="step">
            ${card("act", "数据集", "a₂")}
            ${arrow("去贴")}

  {

    caption: "每走完一步，打分表读当时的信念和任务文本，得到 0 到 1 的 v。v 去贴一个已经算好的标记 y。y 只由这一截后缀和整段的成败位决定。",
    roles: { h: "dim", a: "dim", o: "target", a1: "dim", o1: "target", a2: "dim", o2: "target" },

    roles: { h: "input", a: "input", o: "input", a1: "target hot", o1: "target", a2: "dim", o2: "target" },
    cut: 1,

    ],

let index = 0;
let timer = null;
let playing = false;
let suppressHash = false;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function roleClass(id, roles) {
  const tok = TOKENS.find((t) => t.id === id);
  const role = roles[id] || "show";
  return `tok ${tok.kind} ${role}`;
}

function renderTape(scene) {
  document.getElementById("tape").innerHTML = TOKENS.map((t) => `
    <div class="${roleClass(t.id, scene.roles || {})}">
      <div class="sym">${t.sym}</div>
      <div class="sub">${t.sub}</div>
    </div>`).join("");
}

function renderMap(scene) {
  document.getElementById("minimap").innerHTML = CUTS.map((cut, i) => {
    const on = scene.hotAll || scene.cut === i;
    const pairs = cut.pairs.map((p, pi) => {
      const hot = on && scene.pair === pi ? " hot" : "";
      return `<span class="seg pair${hot}">${p[0]} ${p[1]}</span>`;
    }).join("");
    return `<div class="cut${on ? " on" : ""}">
      <span class="name">${cut.name}</span>
      <span class="seg hist">${cut.hist}</span>
      <span>去贴</span>
      ${pairs}
    </div>`;
  }).join("");
}

function renderFit(scene) {
  const box = document.getElementById("fitbanner");
  if (!scene.fit.length) {
    box.innerHTML = `<span class="fit" style="background:#efeae2;color:var(--muted)"><span class="who">这一步</span>先看结构</span>`;
    return;
  }
  box.innerHTML = scene.fit.map((f) => `
    <span class="fit${f.gold ? " gold" : ""}">
      <span class="who">${f.who}</span>${f.verb}<span class="what">${f.what}</span>
    </span>`).join("");
}

function show(next) {
  const prev = scenes[index];
  if (prev && prev.leave) prev.leave();
  index = (next + scenes.length) % scenes.length;
  const scene = scenes[index];
  renderTape(scene);
  renderMap(scene);
  renderFit(scene);
  document.getElementById("diagram").innerHTML = scene.html();
  document.getElementById("caption").textContent = scene.caption;
  document.getElementById("count").textContent = `${index + 1} / ${scenes.length}  ${scene.title}`;
  document.querySelectorAll("#dots button").forEach((b, i) => b.classList.toggle("on", i === index));
  const nextHash = "#" + (index + 1);
  if (location.hash !== nextHash) {
    suppressHash = true;
    location.hash = nextHash;
  }
  if (scene.enter) scene.enter();
}

window.addEventListener("hashchange", () => {
  if (suppressHash) { suppressHash = false; return; }
  const n = Number(String(location.hash).replace("#", ""));
  if (Number.isFinite(n) && n >= 1 && n <= scenes.length && n - 1 !== index) {
    pause();
    show(n - 1);
  }
});

function play() {
  playing = true;
  document.getElementById("play").textContent = "暂停";
  clearTimeout(timer);
  const delay = reduced ? 9000 : index === 9 ? 7200 : 4800;
  timer = setTimeout(() => { show(index + 1); play(); }, delay);
}

function pause() {
  playing = false;
  document.getElementById("play").textContent = "播放";
  clearTimeout(timer);
}

document.getElementById("dots").innerHTML = scenes.map((_, i) =>
  `<button type="button" data-i="${i}" aria-label="第 ${i + 1} 步"></button>`).join("");
document.getElementById("dots").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  pause();
  show(Number(b.dataset.i));
};
document.getElementById("prev").onclick = () => { pause(); show(index - 1); };
document.getElementById("next").onclick = () => { pause(); show(index + 1); };
document.getElementById("play").onclick = () => playing ? pause() : play();
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { pause(); show(index + 1); }
  if (e.key === "ArrowLeft") { pause(); show(index - 1); }
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
});

const fromHash = Number(location.hash.replace("#", ""));
show(Number.isFinite(fromHash) && fromHash >= 1 && fromHash <= scenes.length ? fromHash - 1 : 0);
</script>
