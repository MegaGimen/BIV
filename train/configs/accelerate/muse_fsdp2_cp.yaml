# Muse Glimmer: FSDP2 + Context Parallelism (Ring Attention).
# num_processes / cp_size are overridden at launch from CUDA_VISIBLE_DEVICES.
# Requires accelerate>=1.11, SDPA (not FlashAttn) for CP.
# TRL: pad_to_multiple_of = cp_size * 2; disable Trainer gradient_checkpointing
# when fsdp_activation_checkpointing is true.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: "no"
enable_cpu_affinity: false
fsdp_config:
  fsdp_activation_checkpointing: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: MuseGlimmerTextDecoderLayer
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_reshard_after_forward: true
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
  fsdp_version: 2
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
# Overridden via --num_processes / --parallelism_config_cp_size
num_processes: 4
# Seconds — tokenize/prep can exceed the default 1800s barrier window
ddp_timeout: 7200
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
parallelism_config:
  parallelism_config_dp_replicate_size: 1
  parallelism_config_dp_shard_size: 1
  parallelism_config_tp_size: 1
  parallelism_config_cp_size: 4
  parallelism_config_cp_backend: torch
