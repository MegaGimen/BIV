# Qwen3-Coder-Next QLoRA via ms-swift (multi-GPU).
#
# Pipeline:
#   1) python scripts/prepare_data.py --all --out-dir data/processed/mix_v2
#   2) python scripts/prepare_model.py     # download base LLM (CPU OK; large disk)
#   3) python scripts/tokenize_data.py     # ratio-sample + swift export cached_dataset
#   4) python scripts/stat.py             # optional: length stats per source
#   5) CUDA_VISIBLE_DEVICES=0,1 bash scripts/train_coder_next.sh --max-length 8192
#
# Install (GPU box):
#   pip install 'ms-swift>=3.11' deepspeed bitsandbytes
#
# Mix: full wm_code + full wm_os; only cap anti_forget = anti_to_os × |wm_os|
# (~32.6k / ~22.0k / ~7.7k with anti_to_os=0.35).
# Tokenize/export never drops or truncates for train length (huge export ceiling).
# Train: pass --max-length; clean+optional 1:1:0.35 rebalance, then sft.

model: Qwen/Qwen3-Coder-Next
# prepare_model.py downloads here; tokenize/train prefer this path when ready.
model_source: modelscope   # modelscope | huggingface | local
model_dir: outputs/models/Qwen3-Coder-Next

biv_mix:
  seed: 42
  mode: full_wm
  # anti rows relative to |wm_os| only (code/os are not downsampled)
  anti_to_os: 0.35

# Where tokenize_data.py writes per-source swift caches + manifest
cache_root: outputs/swift_cache/coder_next_mix_v2
mix_dir: data/processed/mix_v2

# tokenize / export (ms-swift)
# Never drop or truncate here — keep full sequences + true lengths.
# Train applies max_length / truncation_strategy instead.
dataset_num_proc: 8
export:
  # Ceiling only so swift does not use model max (262144) + delete.
  # Must exceed any real row length; does not truncate content.
  max_length: 1048576
  # With a huge max_length, delete never fires on real data.
  truncation_strategy: delete

# train defaults (max_length is REQUIRED at startup via train_coder_next.sh --max-length)
# train_coder_next.sh: structure-preserving right trunc (complete assistant), then
# asks 1=as-is / 2=1:1:0.35 / 3=abort.
train:
  # max_length: set only via CLI — bash scripts/train_coder_next.sh --max-length N
  # After prep, train uses truncation_strategy=delete (rows already <= max_length).
  num_epochs: 2
  learning_rate: 1.0e-4
  lora_rank: 16
  lora_alpha: 16
  # attn only — avoid MoE experts on ~44GB cards
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  # parallel: omit/auto | single | fsdp | device_map | deepspeed
  # Auto (recommended): 1 visible GPU → single; 2+ → fsdp.
  # single = plain QLoRA on one ~80–96GB card (simplest for Qwen3-Coder-Next).
  # fsdp = accelerate FSDP+QLoRA for multi ~48GB cards.
  # parallel: fsdp   # force multi-GPU path
  device_map: auto
  deepspeed: zero3
  fsdp_config: configs/swift/fsdp_qlora.json
  output_dir: outputs/swift_coder_next_wm_mix
  torch_dtype: bfloat16
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 200
  save_total_limit: 3
