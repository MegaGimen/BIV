# Non-secret OSS defaults for Bailian/SFT dataset upload.
# Secrets stay in train/.env (gitignored): OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
#
# 华北6（乌兰察布）bucket wlcbagenttools.
# Tag the bucket (not the name): key=bailian-finetune-access, value=read
# so Bailian service-linked role can read it.
endpoint: https://oss-cn-wulanchabu-internal.aliyuncs.com
# public (cross-network / non-Ulanqab ECS):
#endpoint: https://oss-cn-wulanchabu.aliyuncs.com
region: cn-wulanchabu
bucket: wlcbagenttools
prefix: biv-wm-sft/
# Bailian single-file limit ≈ 190MB — split JSONL on line boundaries before upload.
shard_max_mb: 190
