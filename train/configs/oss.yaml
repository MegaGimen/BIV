# Non-secret OSS defaults for Bailian/SFT dataset upload.
# Secrets stay in train/.env (gitignored): OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
#
# 华北2（北京）+ 同地域 ECS 内网 Endpoint：
endpoint: https://oss-cn-beijing-internal.aliyuncs.com
#region public (only if not on Aliyun ECS / cross-network):
#endpoint: https://oss-cn-beijing.aliyuncs.com
region: cn-beijing
bucket: bjagenttools
prefix: biv-wm-sft/
# Bailian single-file limit ≈ 190MB — split JSONL on line boundaries before upload.
shard_max_mb: 190
