# Kimi-Dev-72B QLoRA via Axolotl (QLoRA + FSDP2 + context parallel).
# Branch: */Axolotl
#
# Install: pip install 'axolotl[ring-flash-attn]'
# Entry: bash scripts/trainmodel.sh --max-length N --choice 1

base_model: outputs/models/Kimi-Dev-72B

biv_mix:
  seed: 42
  mode: max_fill
  ratios:
    wm_code: 1.0
    wm_os: 1.0
    anti_forget: 0.35

load_in_4bit: true
adapter: qlora
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

chat_template: tokenizer_default

datasets:
  - path: data/processed/mix_v2/wm_code/train.jsonl
    type: chat_template
    field_messages: messages
  - path: data/processed/mix_v2/wm_os/train.jsonl
    type: chat_template
    field_messages: messages
  - path: data/processed/mix_v2/anti_forget/train.jsonl
    type: chat_template
    field_messages: messages

val_set_size: 0.0
dataset_prepared_path: outputs/axolotl_cache/kimi_dev_72b_mix_v2
output_dir: outputs/axolotl_kimi_dev_72b_wm_mix

sequence_len: 8192
sample_packing: false
pad_to_sequence_len: true

micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 2
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.03

bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
flash_attention: true
attn_implementation: flash_attention_2

logging_steps: 10
saves_per_epoch: 2
save_total_limit: 3

fsdp_version: 2
fsdp_config:
  fsdp_limit_all_gathers: true
  fsdp_sync_module_states: true
  fsdp_offload_params: false
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen2DecoderLayer
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_reshard_after_forward: true

dp_shard_size: 2
context_parallel_size: 2

special_tokens:
  pad_token: "<|endoftext|>"

wandb_project:
wandb_name:
