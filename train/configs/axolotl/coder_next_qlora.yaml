# Qwen3-Coder-Next QLoRA via Axolotl (QLoRA + FSDP2 + context parallel).
# Branch: Qwen3-Coder-Next/Axolotl
#
# Install (GPU box):
#   pip install 'axolotl[ring-flash-attn]'
#
# Pipeline:
#   1) python scripts/prepare_data.py --all --out-dir data/processed/mix_v2
#   2) python scripts/prepare_model.py --config configs/swift/coder_next_qlora.yaml
#   3) bash scripts/trainmodel.sh --max-length 8192 --choice 1
#   32k smoke: CUDA_VISIBLE_DEVICES=0,1 bash scripts/trainmodel.sh --max-length 32768 --choice 1
#
# trainmodel.sh rewrites context_parallel_size / sequence_len / dataset paths at runtime.

base_model: outputs/models/Qwen3-Coder-Next
# Fallback hub id if local dir missing (prepare_model preferred):
# base_model: Qwen/Qwen3-Coder-Next

biv_mix:
  seed: 42
  mode: max_fill
  ratios:
    wm_code: 1.0
    wm_os: 1.0
    anti_forget: 0.35

load_in_4bit: true
adapter: qlora
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

chat_template: tokenizer_default

datasets:
  - path: data/processed/mix_v2/wm_code/train.jsonl
    type: chat_template
    field_messages: messages
  - path: data/processed/mix_v2/wm_os/train.jsonl
    type: chat_template
    field_messages: messages
  - path: data/processed/mix_v2/anti_forget/train.jsonl
    type: chat_template
    field_messages: messages

val_set_size: 0.0
dataset_prepared_path: outputs/axolotl_cache/coder_next_mix_v2
output_dir: outputs/axolotl_coder_next_wm_mix

sequence_len: 8192
sample_packing: false
pad_to_sequence_len: true

micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 2
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.03

bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
flash_attention: true
attn_implementation: flash_attention_2

logging_steps: 10
saves_per_epoch: 2
save_total_limit: 3

# FSDP2 + context parallel (long-context activation shard).
# trainmodel.sh sets context_parallel_size / dp_shard_size from CUDA_VISIBLE_DEVICES.
fsdp_version: 2
fsdp_config:
  fsdp_limit_all_gathers: true
  fsdp_sync_module_states: true
  fsdp_offload_params: false
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen3NextDecoderLayer
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_reshard_after_forward: true

dp_shard_size: 2
context_parallel_size: 2

special_tokens:
  pad_token: "<|endoftext|>"

wandb_project:
wandb_name:
