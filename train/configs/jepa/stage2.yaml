# Stage 2 Step 1 (门口): frozen AgentWorld+JEPA + frozen Instruct backbone.
# Train draft head, scorer, and W. Command CE goes through W → Instruct lm_head.
#
#   cd train
#   CUDA_VISIBLE_DEVICES=0,1 bash scripts/train_jepa_s2.sh --jepa-ckpt auto
#   CUDA_VISIBLE_DEVICES=0,1 bash scripts/train_jepa_s2.sh --jepa-ckpt outputs/jepa_stage1/checkpoint-epoch2-end-s13630
#
# jepa_ckpt: auto = newest complete Stage 1 dir under jepa_dir (epoch-end ranks highest).
world_dir: Qwen/Qwen-AgentWorld-35B-A3B
instruct_dir: Qwen/Qwen3.5-35B-A3B
jepa_dir: outputs/jepa_stage1
jepa_ckpt: auto
mix_dir: data/processed/mix_v2
sources:
  - wm_code
  - wm_os

train:
  step: 1
  n_drafts: 3
  max_length: 32768
  batch_size: 1
  grad_accum: 8
  lr: 1.0e-4
  weight_decay: 0.01
  num_epochs: 1
  log_steps: 5
  save_steps: 25
  save_total_limit: 50
  rank_lbd: 1.0
  ce_lbd: 1.0
  last_token: -3
  logging_dir: null
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - shared_expert_gate
  output_dir: outputs/jepa_stage2
  torch_dtype: bfloat16
  gradient_checkpointing: true
  max_train_samples: null
