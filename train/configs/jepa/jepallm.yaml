# Stage 1 LLM-JEPA on AgentWorld's own 40-layer backbone (no fish-cut).
# Two losses (Huang et al. 2025, arXiv:2509.14252): observation token CE
# through AgentWorld's lm_head + last-hidden cosine of Enc(h+a) vs Enc(o).
# No JEPA MLP, no inverse dynamics, no SimCSE/bank.
#
#   cd train && CUDA_VISIBLE_DEVICES=0,1,2,3 bash scripts/train_jepallm.sh
#
# model_dir is a hub id / local dir; auto-downloaded into merge/output/cache.
model_dir: Qwen/Qwen-AgentWorld-35B-A3B
mix_dir: data/processed/mix_v2
sources:
  - wm_code
  - wm_os

train:
  max_length: 65536
  batch_size: 1
  grad_accum: 8
  lr: 5.0e-5
  weight_decay: 0.01
  num_epochs: 2
  log_steps: 5
  save_steps: 25
  save_total_limit: 3
  # LLM-JEPA: gamma * CE + lbd * (1 - cosine). Their default lbd=0.1.
  ce_weight: 1.0
  jepa_weight: 0.1
  logging_dir: null
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - shared_expert_gate
  output_dir: outputs/jepallm_stage1
  torch_dtype: bfloat16
  gradient_checkpointing: true
  max_train_samples: null
