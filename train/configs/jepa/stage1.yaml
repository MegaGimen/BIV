# Stage 1 on AgentWorld's own 40-layer backbone (no fish-cut).
# Mediated targets + Delta-JEPA LDAD. Live launch: N-GPU FSDP2+CP, seq-split.
#
#   cd train && CUDA_VISIBLE_DEVICES=0,1,2,3 bash scripts/train_jepa.sh
#   CUDA_VISIBLE_DEVICES=0,1 MAX_LENGTH=65536 bash scripts/train_jepa.sh
#
# model_dir is a hub id / local dir; auto-downloaded into merge/output/cache.
model_dir: Qwen/Qwen-AgentWorld-35B-A3B
mix_dir: data/processed/mix_v2
sources:
  - wm_code
  - wm_os

train:
  max_length: 32768
  batch_size: 1
  grad_accum: 8
  lr: 5.0e-5
  weight_decay: 0.01
  num_epochs: 2
  log_steps: 5
  save_steps: 25
  # ~185MB each; 50 ≈ 9GB rolling (epoch-end ckpts are extra and never rotated).
  save_total_limit: 50
  # live: pred_lbd * L_pred + inv_lbd * L_action + sigreg_lbd * SIGReg.
  # gamma>0 would add observation CE.
  gamma: 0.0
  pred_lbd: 1.0
  inv_lbd: 10.0
  # LeJEPA SIGReg (Epps–Pulley vs N(0,1), 1024 slices). Token cloud because batch_size=1.
  sigreg_lbd: 0.1
  sigreg_slices: 1024
  sigreg_tokens: 512
  last_token: -3
  logging_dir: null
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - shared_expert_gate
  output_dir: outputs/jepa_stage1
  torch_dtype: bfloat16
  gradient_checkpointing: true
  max_train_samples: null
