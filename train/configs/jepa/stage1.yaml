# Stage 1 JEPA on AgentWorld's own, unmodified 40-layer backbone.
# No fish-cut, no Instruct: AgentWorld and Instruct stay two separate
# backbones (AGENTS.md "模型架构"); Stage 2 attaches Instruct + draft/scorer/W
# and calls this trained, frozen JEPA like an advisor.
# Data: existing mix_v2 wm_code + wm_os (not anti_forget).
#
# Hyperparams are NOT Muse Glimmer SFT. Muse 2e-4 + token CE teaches a
# generator to write observation text. Here the loss is cosine align of a
# new MLP predictor in 2048-d, and AgentWorld already went CPT → next-state
# SFT → RL. LoRA only nudges that geometry; the MLP is a randomly inited head.
#
#   cd train && CUDA_VISIBLE_DEVICES=0,1,2,3 bash scripts/train_jepa.sh
#   python train/scripts/train_jepa.py --config train/configs/jepa/stage1.yaml
#
# model_dir is a hub id / local dir; auto-downloaded into merge/output/cache
# if missing (same convention as compare.py / probe.py / cut_stage1.py).
model_dir: Qwen/Qwen-AgentWorld-35B-A3B
mix_dir: data/processed/mix_v2
sources:
  - wm_code
  - wm_os

train:
  max_length: 65536
  batch_size: 1
  grad_accum: 8
  # Backbone LoRA: ~1/4 of Muse SFT (2e-4). Cosine hidden-align, already-trained WM.
  lr: 5.0e-5
  weight_decay: 0.01
  # Predictor MLP: new params, ~20× backbone so the head moves first (JEPA-style).
  jepa_lr: 1.0e-3
  jepa_weight_decay: 0.0
  num_epochs: 2
  logging_steps: 10
  # Checkpoint vs collapse check are independent. CLI can override either.
  #   --save-steps N      (default 25)  rolling checkpoint-e{epoch}-s{step}
  #   --collapse-steps N  (default 10)  collapse stats on the rows just trained
  # Mid-run rolling dirs keep newest save_total_limit. Epoch-end is permanent.
  # --save-steps 1 smokes that FSDP adapter save works. --resume picks newest
  # complete ckpt under output_dir (epoch first, then step).
  save_steps: 25
  collapse_steps: 10
  save_total_limit: 3
  # Anti-collapse terms on the same (h,a,o) step. Cosine align stays the main
  # term. Ranking NCE uses a queue of recent z* (drop identical observation
  # text). Inverse MLP recovers u* from (c_t, z*).
  rank_weight: 0.3
  inv_weight: 0.3
  rank_temperature: 0.1
  rank_queue: 256
  # TensorBoard root. AutoDL's panel watches /root/tf-logs (same as Muse).
  # Override with $LOGGING_DIR or $TF_LOGS or --logging-dir.
  logging_dir: null
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - shared_expert_gate
  jepa_hidden: 4096
  output_dir: outputs/jepa_stage1
  torch_dtype: bfloat16
  gradient_checkpointing: true
  max_train_samples: null
