# Stage 1 LLM-JEPA on AgentWorld's own 40-layer backbone (no fish-cut).
# Wiring from galilai-group/llm-jepa RepresentationTrainer: independent
# Enc(history+command) and Enc(observation), last_token cosine, shifted CE
# on observation tokens. Parallelism/memory: FSDP2+CP, hidden-only forward.
#
#   cd train && CUDA_VISIBLE_DEVICES=0,1,2,3 bash scripts/train_jepa.sh
#
# model_dir is a hub id / local dir; auto-downloaded into merge/output/cache.
model_dir: Qwen/Qwen-AgentWorld-35B-A3B
mix_dir: data/processed/mix_v2
sources:
  - wm_code
  - wm_os

train:
  max_length: 65536
  batch_size: 1
  grad_accum: 8
  lr: 5.0e-5
  weight_decay: 0.01
  num_epochs: 2
  log_steps: 5
  save_steps: 25
  save_total_limit: 3
  # llm-jepa: total = gamma * CE + lbd * (1 - cosine)
  gamma: 1.0
  lbd: 0.1
  # Qwen: their run.sh comment uses last_token=-3 (skip trailing specials)
  last_token: -3
  logging_dir: null
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - shared_expert_gate
  output_dir: outputs/jepa_stage1
  torch_dtype: bfloat16
  gradient_checkpointing: true
  max_train_samples: null
