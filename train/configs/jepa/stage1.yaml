# Stage 1 JEPA on AgentWorld's own, unmodified 40-layer backbone.
# No fish-cut, no Instruct: AgentWorld and Instruct stay two separate
# backbones (AGENTS.md "模型架构"); Stage 2 attaches Instruct + draft/scorer/W
# and calls this trained, frozen JEPA like an advisor.
# Data: existing mix_v2 wm_code + wm_os (not anti_forget).
#
# Hyperparams are NOT Muse Glimmer SFT. Muse 2e-4 + token CE teaches a
# generator to write observation text. Here the loss is cosine align of a
# new MLP predictor in 2048-d, and AgentWorld already went CPT → next-state
# SFT → RL. LoRA only nudges that geometry; the MLP is a randomly inited head.
#
#   cd train && CUDA_VISIBLE_DEVICES=0,1,2,3 bash scripts/train_jepa.sh
#   python train/scripts/train_jepa.py --config train/configs/jepa/stage1.yaml
#
# model_dir is a hub id / local dir; auto-downloaded into merge/output/cache
# if missing (same convention as compare.py / probe.py / cut_stage1.py).
model_dir: Qwen/Qwen-AgentWorld-35B-A3B
mix_dir: data/processed/mix_v2
sources:
  - wm_code
  - wm_os

train:
  max_length: 65536
  batch_size: 1
  grad_accum: 8
  # Backbone LoRA: ~1/4 of Muse SFT (2e-4). Cosine hidden-align, already-trained WM.
  lr: 5.0e-5
  weight_decay: 0.01
  # Predictor MLP: new params, ~20× backbone so the head moves first (JEPA-style).
  jepa_lr: 1.0e-3
  jepa_weight_decay: 0.0
  num_epochs: 2
  # Loss scalars + collapse stats share this clock (CPU on cached ẑ/z*, no extra
  # forward). Save stays separate. Override: --log-steps N  --save-steps N
  log_steps: 5
  # Mid-run: checkpoint-e{epoch}-s{step}, keep newest save_total_limit.
  # Epoch-end: checkpoint-epoch{N}-end-s{step} (permanent).
  # --save-steps 1 smokes that FSDP adapter save works. --resume picks newest
  # complete ckpt under output_dir (epoch first, then step).
  save_steps: 25
  save_total_limit: 3
  # Inverse MLP recovers u* from (c_t, stop-grad z*). Weight 0.3 vs the
  # main cosine-align term (1.0).
  inv_weight: 0.3
  # Anti-collapse (AGENTS.md "JEPA 家族怎么防坍缩"). align_loss + inv_loss
  # alone measurably collapsed within 25 steps (pred_self_median 0.69→0.996)
  # because z* is stop-grad — inv's own gradient never reaches the encoder
  # that produces z*. Two more terms fix that, neither needs a batch-level
  # covariance estimate (VICReg/SIGReg) or a whole-network EMA teacher
  # (I-JEPA), both infeasible at batch=1/accum=8 on a 35B backbone.
  #
  # 1) loss_simcse: SimCSE-style, but MoCo-shaped (asymmetric) instead of
  #    symmetric — one extra *live* forward per micro-batch (z1: same o_ids as
  #    z, a second dropout draw) is the query; this micro-batch's own z (the
  #    no-grad one computed anyway for loss_align) is the positive; the same
  #    bank_z below is the negatives. Folded into the same backward as
  #    everything else — no separate group buffer, no deferred backward.
  #    The only term whose gradient reaches the encoder that produces z*.
  #    Costs one extra full-backbone forward+recompute per micro-batch — real,
  #    not free; a first version that used two live forwards plus a separate
  #    group buffer cost roughly double this and is why an early smoke run
  #    went from ~300h/epoch to ~450h/epoch (see AGENTS.md).
  nce_weight: 0.1
  nce_temperature: 0.05
  # 2) loss_bank: corrected version of the queue NCE that blew up loss_align
  #    last time. Differences from that attempt: bank is small and fresh
  #    (rolls every step, not a 256-deep multi-epoch-stale queue), softmax
  #    cross-entropy with temperature instead of a hand-picked "push cosine
  #    to 0" target, and it now runs alongside loss_simcse instead of being
  #    the only anti-collapse force fighting a static, ungraded target space.
  bank_weight: 0.2
  bank_temperature: 0.05
  # Just detached 2048-d vectors (256 × 2048 × 4B ≈ 2MB) — practically free,
  # raise freely for more negatives. h's own sequence length is the real
  # memory/time cost, not this.
  bank_size: 256
  # TensorBoard root. AutoDL's panel watches /root/tf-logs (same as Muse).
  # Override with $LOGGING_DIR or $TF_LOGS or --logging-dir.
  logging_dir: null
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - shared_expert_gate
  jepa_hidden: 4096
  output_dir: outputs/jepa_stage1
  torch_dtype: bfloat16
  gradient_checkpointing: true
  # Space-for-time: un-checkpoint linear-attention (Gated DeltaNet) layers.
  # Full-attention layers (O(L²) KV memory — ~8 GiB/layer at L=65536) stay
  # checkpointed. Linear-attention layers are O(L) and fit in the ~33 GiB/GPU
  # headroom even at max_length=65536. Saves ~30/40 backward recomputation
  # passes per live forward; estimated to cut epoch time by ~20-25%.
  # Disable if OOM on longest sequences (set false, not remove entirely).
  selective_checkpointing: true
  # Space-for-time: batch z (no-grad) and z1 (live, for loss_simcse) into one
  # forward call with batch_size×2 on o_ids. Eliminates one full 40-layer
  # FSDP2 all-gather round. Only active when nce_weight > 0. Disable if
  # context-parallel + batch>1 causes issues on this setup (set false).
  batch_o_z1: true
  max_train_samples: null
