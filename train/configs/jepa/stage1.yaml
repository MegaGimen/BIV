# Stage 1 JEPA on AgentWorld's own, unmodified 40-layer backbone.
# No fish-cut, no Instruct: AgentWorld and Instruct stay two separate
# backbones (AGENTS.md "模型架构"); Stage 2 attaches Instruct + draft/scorer/W
# and calls this trained, frozen JEPA like an advisor.
# Data: existing mix_v2 wm_code + wm_os (not anti_forget).
#
#   cd train && CUDA_VISIBLE_DEVICES=0,1,2,3 bash scripts/train_jepa.sh
#   python train/scripts/train_jepa.py --config train/configs/jepa/stage1.yaml
#
# model_dir is a hub id / local dir; auto-downloaded into merge/output/cache
# if missing (same convention as compare.py / probe.py / cut_stage1.py).
model_dir: Qwen/Qwen-AgentWorld-35B-A3B
mix_dir: data/processed/mix_v2
sources:
  - wm_code
  - wm_os

train:
  max_length: 65536
  batch_size: 1
  grad_accum: 8
  lr: 2.0e-4
  jepa_lr: 1.0e-3
  num_epochs: 1
  logging_steps: 10
  save_steps: 100
  # TensorBoard root. Override with $LOGGING_DIR or $TF_LOGS (Muse uses /root/tf-logs).
  logging_dir: null
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - shared_expert_gate
  jepa_hidden: 4096
  output_dir: outputs/jepa_stage1
  torch_dtype: bfloat16
  gradient_checkpointing: true
  max_train_samples: null
  max_eval_samples: 128
