# 32768-length smoke variant of jepallm.yaml: 4 GPUs as 2 groups of 2, each
# group doing Context Parallel — roughly 2x throughput vs the 65536/4-way-CP
# run, at the cost of truncating longer rows. Same recipe otherwise (see
# jepallm.yaml / AGENTS.md). output_dir and TensorBoard tag are separate from
# the 65536 run so neither overwrites the other.
#
#   cd train && CUDA_VISIBLE_DEVICES=0,1,2,3 bash scripts/train_jepallm_32k.sh
#
model_dir: Qwen/Qwen-AgentWorld-35B-A3B
mix_dir: data/processed/mix_v2
sources:
  - wm_code
  - wm_os

train:
  max_length: 32768
  batch_size: 1
  grad_accum: 8
  lr: 5.0e-5
  weight_decay: 0.01
  num_epochs: 2
  log_steps: 5
  save_steps: 25
  save_total_limit: 3
  # llm-jepa: total = gamma * CE + lbd * (1 - cosine)
  gamma: 1.0
  lbd: 0.1
  last_token: -3
  logging_dir: null
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - shared_expert_gate
  output_dir: outputs/jepallm32k_stage1
  torch_dtype: bfloat16
  gradient_checkpointing: true
  max_train_samples: null
