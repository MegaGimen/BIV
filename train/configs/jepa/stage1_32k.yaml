# Same recipe as stage1.yaml (32768 / 2x2). Live entry is train_jepa.sh;
# this file remains so older --config / probe defaults still resolve.
#
#   cd train && CUDA_VISIBLE_DEVICES=0,1,2,3 bash scripts/train_jepa.sh
#
model_dir: Qwen/Qwen-AgentWorld-35B-A3B
mix_dir: data/processed/mix_v2
sources:
  - wm_code
  - wm_os

train:
  max_length: 32768
  batch_size: 1
  grad_accum: 8
  lr: 5.0e-5
  weight_decay: 0.01
  num_epochs: 2
  log_steps: 5
  save_steps: 25
  save_total_limit: 3
  gamma: 1.0
  pred_lbd: 1.0
  inv_lbd: 10.0
  last_token: -3
  logging_dir: null
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - shared_expert_gate
  output_dir: outputs/jepa_stage1
  torch_dtype: bfloat16
  gradient_checkpointing: true
  max_train_samples: null
