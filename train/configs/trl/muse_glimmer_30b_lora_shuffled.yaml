# Shuffled-observation control twin for Muse Glimmer WM SFT.
# Identical to muse_glimmer_30b_lora.yaml except shuffle flag + output/cache paths.
#
# Requires mix JSONL built with shuffled observations (prepare_data --shuffle-obs
# or a dedicated shuffled mix_dir). Point mix_dir at that corpus when ready.

model: meta-models/Muse-Glimmer-30B
model_source: modelscope
model_dir: outputs/models/Muse-Glimmer-30B

biv_mix:
  seed: 42
  mode: full_wm
  anti_to_os: 0.35

cache_root: outputs/trl_cache/muse_glimmer_mix_v2_shuffled
mix_dir: data/processed/mix_v2_shuffled

dataset_num_proc: 8
export:
  max_length: 1048576
  truncation_strategy: delete

# Marker for docs / scripts that branch on control arm
shuffle_observation: true

train:
  num_epochs: 2
  learning_rate: 2.0e-4
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - output_gate_proj
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  parallel: auto
  qlora: false
  freeze_vision: true
  assistant_only_loss: true
  packing: false
  gradient_checkpointing: true
  output_dir: outputs/muse_glimmer_wm_mix_shuffled
  torch_dtype: bfloat16
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 50
  save_total_limit: 3
  # resume_from: auto   # or ckpt path; same ranking as train_daemon.sh
  # Anti-forget held-out monitor (mix_dir/anti_forget/eval.jsonl); logs eval_anti_forget_loss.
  # eval_mode: post_save (default) | inline | off. Omit eval_steps → same as save_steps.
  eval_mode: post_save
  eval_max_samples: 128
  per_device_eval_batch_size: 1
  seed: 42
