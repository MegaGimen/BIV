# meta-models/Muse-Glimmer-30B LoRA/QLoRA via TRL + PEFT + Accelerate (branch: Muse).
#
# Pipeline:
#   1) python scripts/prepare_data.py --all --out-dir data/processed/mix_v2
#   2) python scripts/prepare_model.py   # ModelScope meta-models/Muse-Glimmer-30B
#   3) python scripts/tokenize_data.py
#   4) python scripts/stat.py --max-length 8192   # optional
#   5) CUDA_VISIBLE_DEVICES=0 bash scripts/trainmodel.sh --max-length 8192 --choice 1
#      CUDA_VISIBLE_DEVICES=0,1,2,3 bash scripts/trainmodel.sh --max-length 32768 --choice 1
#      # auto → FSDP2+CP (cp_size=#GPUs) so longer max_length fits across cards
#      PARALLEL=ddp bash scripts/trainmodel.sh --max-length 8192 --choice 1
#      QLORA=1 bash scripts/trainmodel.sh --max-length 8192 --choice 1
#
# Install: pip install -r requirements-muse.txt
# Hub: https://www.modelscope.cn/models/meta-models/Muse-Glimmer-30B
#
# Arch notes:
#   - Dense ~29.6B + frozen Perception Encoder (~1.8B ViT)
#   - Chat template: Muse Glimmer (transformers AutoTokenizer)
#   - Loss: TRL assistant_only_loss on observation turns
#   - Parallel auto: 1 GPU → single; 2+ → FSDP2 + Context Parallel (Ring Attention)
#     Override: PARALLEL=ddp|fsdp2|fsdp2_cp|single

model: meta-models/Muse-Glimmer-30B
model_source: modelscope
model_dir: outputs/models/Muse-Glimmer-30B

biv_mix:
  seed: 42
  mode: full_wm
  anti_to_os: 0.35

cache_root: outputs/trl_cache/muse_glimmer_mix_v2
mix_dir: data/processed/mix_v2

dataset_num_proc: 8
export:
  # Char-budget length only at tokenize; train applies max_length
  max_length: 1048576
  truncation_strategy: delete

train:
  num_epochs: 2
  learning_rate: 2.0e-4
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - output_gate_proj
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  # auto | single | ddp | fsdp2 | fsdp2_cp
  # trainmodel.sh auto: 1 GPU→single; 2+→fsdp2_cp (longer max_length)
  parallel: auto
  qlora: false
  freeze_vision: true
  assistant_only_loss: true
  packing: false
  # When PARALLEL=fsdp2_cp: Trainer gradient_checkpointing ON + Liger fused CE;
  # FSDP activation_checkpointing stays OFF (cannot both be True).
  gradient_checkpointing: true
  # Auto-enabled for CP / long max_length in train_muse_trl.py when installed.
  use_liger_kernel: true
  output_dir: outputs/muse_glimmer_wm_mix
  torch_dtype: bfloat16
  warmup_ratio: 0.03
  logging_steps: 10
  # Mid-run: every N steps → checkpoint-e{epoch}-s{step}; keep newest save_total_limit.
  # Epoch-end: always save checkpoint-epoch{N}-end-s{step} (permanent) + evaluate.
  # HF Trainer save_total_limit is disabled in code (mtime rotate would wipe epoch-end).
  # Temporarily 25 to verify resume overrides trainer_state.save_steps (was 50).
  save_steps: 25
  save_total_limit: 3
  # Resume: null | absolute/relative ckpt path | "auto" (latest complete under output_dir;
  # same ranking as train_daemon.sh). CLI: --resume-from PATH|auto
  # resume_from: auto
  # Full Trainer ckpts restore optimizer / LR scheduler / RNG (no extra packing needed).
  # Anti-forget held-out monitor (mix_dir/anti_forget/eval.jsonl); logs eval_anti_forget_loss.
  # Omit eval_steps → same cadence as save_steps.
  eval_max_samples: 128
  per_device_eval_batch_size: 1
  seed: 42
