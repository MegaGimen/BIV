# Prefer editable install from this directory:
#   pip install -e .
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biv-wm"
version = "0.1.0"
description = "World-model SFT utilities for BIV environment-consistency training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
